<!doctype html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}{{t "site.name"}}{{end}}</title>
<meta name="description" content="{{block "description" .}}{{t "site.description"}}{{end}}">
{{if .NoIndex}}<meta name="robots" content="noindex">
{{end}}{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">
{{end}}{{range $lang, $url := .Alternates}}<link rel="alternate" hreflang="{{$lang}}" href="{{$url}}">
{{end}}{{entry "src/entry.ts"}}
{{block "head" .}}{{end}}
</head>
<body>
{{block "body" .}}{{end}}
</body>
</html>
