# Hearth behind nginx: prebuilt files, then the render cache, then the Go server.
# Include from http {}. Not run against a live nginx here (see docs/DEPLOY.md "Verify");
# run deploy/verify.sh against it and `nginx -t` before reload.
#
# Paths:  /srv/hearth/public         hearth build output (dist/public)
#         /srv/hearth/cache/public   the Go server's cache directory, HEARTH_CACHE_DIR (mount read-only)
#         /srv/hearth/cache/tmp      HEARTH_TMP_DIR, same mount, never served

upstream hearth_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name example.com;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # 0. A missing static path (for example a missing /assets/ file) answers 404 with the page that
    #    `hearth build` writes from pages/404.html. Paths that reach the Go server get the branded 404
    #    from it directly (proxy_intercept_errors stays off, so its 404 and 410 bodies pass through).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /srv/hearth/public;
        add_header Cache-Control "no-store";
    }

    # 1. One URL per page: no trailing slash, no /index.html. (Query strings are kept.)
    rewrite ^/(.+)/index\.html$ /$1 permanent;
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(.+)/$ /$1 permanent;

    # 2. Never serve dotfiles. The cache writes atomically through ".tmp-*" files that
    #    must not be reachable while they are half written.
    location ~ /\. {
        return 404;
    }

    # 3. Health and counters are for the platform, not the internet.
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://hearth_app;
    }

    # 4. Hashed assets: cache forever. (Skip this block if assets live on a CDN/S3.)
    location /assets/ {
        root /srv/hearth/public;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. Prebuilt pages first; then pages the Go server rendered earlier; then the Go server.
    #    The query string never selects a file (the cache key is the path only).
    location / {
        root /srv/hearth/public;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html @cache;
    }

    location @cache {
        root /srv/hearth/cache/public;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html @app;
    }

    # 6. The Go server renders, writes the file, answers. The next request is served by @cache.
    location @app {
        proxy_pass http://hearth_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;   # a render is not safe to repeat blindly
    }
}

# Subdomain/domain i18n (i18n.mode "subdomain" or "domain"): the cache has one directory per host,
# and `hearth build` writes one 404.html per host directory.
# Use one server block per host with an explicit server_name and:
#     location @cache { root /srv/hearth/cache/public/he.example.com; ... }
#     location = /404.html { internal; root /srv/hearth/public/he.example.com; }
# Do not build the path from $host: a Host header must never choose a directory.
